<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SYGMEBEC — Sidebar</title>
<style>
  :root{
    --grad-a:   #05006B;   /* bleu royal (haut du dégradé, comme le splash) */
    --grad-b:   #000024;   /* bleu marine très foncé (bas du dégradé) */
    --panel:    #060335;   /* bleu foncé — panneaux / hover */
    --panel-2:  #0B0755;   /* bleu foncé un peu plus clair */
    --blue:     #3D63F4;   /* bleu vif — accent / actif */
    --blue-soft: rgba(61,99,244,0.16);
    --blue-line: rgba(90,120,255,0.22);
    --ink-1:    #DDE4FF;   /* texte principal (bleu très clair) */
    --ink-2:    #8C9BD9;   /* texte secondaire */
    --ink-3:    #55609E;   /* texte tertiaire / icônes au repos */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: var(--grad-b);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--grad-b);
  }

  .sidebar{
    width:300px;
    height:90vh;
    max-height:840px;
    background: linear-gradient(160deg, var(--grad-a) 0%, var(--panel) 42%, var(--grad-b) 100%);
    border: 1px solid var(--blue-line);
    border-radius: 24px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    box-shadow:
      0 40px 80px -24px rgba(0,0,10,0.75),
      0 0 0 1px rgba(61,99,244,0.06) inset;
    animation: rise .75s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(26px) scale(0.97); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  /* halo respirant en fond, discret */
  .sidebar::after{
    content:"";
    position:absolute;
    top:-40%; left:-20%;
    width:70%; height:70%;
    background: radial-gradient(circle, rgba(80,110,255,0.20), transparent 65%);
    animation: breathe 7s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ opacity:0.5; transform: scale(1); }
    50%{ opacity:1; transform: scale(1.15); }
  }

  /* liseré animé en haut */
  .sidebar::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, var(--blue), transparent);
    background-size: 200% 100%;
    animation: seam 6s linear infinite;
    opacity:0.7;
    z-index:2;
  }
  @keyframes seam{
    0%{ background-position: 200% 0; }
    100%{ background-position: -200% 0; }
  }

  /* ---------- Header / Brand ---------- */
  .header{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:10px;
    padding: 28px 20px 22px;
    border-bottom: 1px solid var(--blue-line);
  }

  .logo-badge{
    width:64px; height:64px;
    border-radius:18px;
    background: radial-gradient(circle at 35% 30%, #0A0768, #000018 75%);
    border: 1px solid var(--blue-line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
    box-shadow: 0 0 0 1px rgba(61,99,244,0.05) inset;
  }
  .logo-badge img{
    width:112%; height:112%;
    object-fit:cover;
  }
  .logo-badge::after{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 30% 20%, rgba(90,120,255,0.35), transparent 60%);
    animation: glow 4s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ opacity:0.35; }
    50%{ opacity:0.9; }
  }

  .brand-name{
    font-size:19px;
    font-weight:800;
    letter-spacing:0.4px;
    color: var(--ink-1);
  }

  .brand-sub{
    font-size:10.5px;
    color: var(--ink-3);
    letter-spacing:0.3px;
    line-height:1.5;
    max-width:220px;
  }

  .collapse-btn{
    position:absolute;
    top:20px; right:16px;
    width:28px; height:28px;
    border-radius:9px;
    border:1px solid var(--blue-line);
    background: rgba(11,7,85,0.6);
    color: var(--ink-2);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: all .25s ease;
  }
  .collapse-btn:hover{
    background: var(--blue-soft);
    color: var(--blue);
    transform: translateX(-2px);
  }
  .collapse-btn svg{ width:13px; height:13px; }

  /* ---------- Nav ---------- */
  nav{
    flex:1;
    overflow-y:auto;
    padding: 16px 12px;
    display:flex;
    flex-direction:column;
    gap:2px;
    position:relative;
    z-index:1;
  }

  .nav-label{
    font-size:10px;
    color: var(--ink-3);
    letter-spacing:1.6px;
    padding: 12px 12px 8px;
  }

  .item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:11px 14px;
    border-radius:12px;
    color: var(--ink-2);
    font-size:13.5px;
    font-weight:500;
    text-decoration:none;
    cursor:pointer;
    position:relative;
    transition: color .25s ease, background .25s ease;
    animation: fade-in .5s ease both;
  }

  nav .item:nth-child(2){ animation-delay: .04s; }
  nav .item:nth-child(3){ animation-delay: .08s; }
  nav .item:nth-child(4){ animation-delay: .12s; }
  nav .item:nth-child(5){ animation-delay: .16s; }
  nav .item:nth-child(6){ animation-delay: .20s; }
  nav .item:nth-child(8){ animation-delay: .24s; }
  nav .item:nth-child(9){ animation-delay: .28s; }
  nav .item:nth-child(10){ animation-delay: .32s; }
  nav .item:nth-child(11){ animation-delay: .36s; }

  @keyframes fade-in{
    from{ opacity:0; transform: translateX(-8px); }
    to{ opacity:1; transform: translateX(0); }
  }

  .item .icon{
    width:18px; height:18px;
    flex-shrink:0;
    color: var(--ink-3);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), color .25s ease;
  }

  .item:hover{
    color: var(--ink-1);
    background: rgba(90,120,255,0.08);
  }
  .item:hover .icon{
    color: var(--blue);
    transform: translateY(-1px);
  }

  .item.active{
    color: #EEF2FF;
    background: linear-gradient(90deg, var(--blue-soft), transparent);
  }
  .item.active .icon{ color: var(--blue); }

  .item.active::before{
    content:"";
    position:absolute;
    left:-12px; top:8%; bottom:8%;
    width:3px;
    border-radius:3px;
    background: var(--blue);
    box-shadow: 0 0 12px 1px var(--blue);
    animation: pop .4s ease both;
  }
  @keyframes pop{
    from{ transform: scaleY(0); opacity:0; }
    to{ transform: scaleY(1); opacity:1; }
  }

  .item.active::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:12px;
    border:1px solid var(--blue-line);
    pointer-events:none;
  }

  .divider{
    height:1px;
    background: var(--blue-line);
    margin: 6px 6px 14px;
    position:relative;
    z-index:1;
  }

  /* ---------- Footer ---------- */
  .footer{
    padding: 0 12px 20px;
    display:flex;
    flex-direction:column;
    gap:2px;
    position:relative;
    z-index:1;
  }

  .footer .item.logout .icon{ color:#5a6ab0; }
  .footer .item.logout:hover{ background: rgba(90,120,255,0.09); }
  .footer .item.logout:hover .icon{ color: var(--blue); transform: translateX(2px); }

</style>
</head>
