<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SYGMEBEC — Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#4f96e8;
    --accent-soft:#a9cdfb;
    --accent-line: rgba(90,160,240,0.18);
    --active-bg: rgba(79,150,232,0.14);
    --text-primary:#f4f6fb;
    --text-muted:#8fa0cf;
    --text-faint:#57628e;
    --danger:#e8735f;
    --glass: rgba(255,255,255,0.035);
    --glass-border: rgba(255,255,255,0.075);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(60,80,180,0.35), transparent 45%),
      linear-gradient(180deg,#0a0f2c 0%, #05070f 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:40px 20px;
    overflow:hidden;
  }

  .sidebar{
    position:relative;
    width:308px;
    height:780px;
    max-height:94vh;
    border-radius:28px;
    background:
      radial-gradient(120% 55% at 15% -8%, rgba(70,95,220,0.35), transparent 55%),
      linear-gradient(155deg, #1b2c8f 0%, #101b5e 28%, #0a1140 52%, #05081f 78%, #020309 100%);
    border:1px solid var(--accent-line);
    box-shadow:
      0 45px 90px -22px rgba(0,0,0,0.75),
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 1px 0 rgba(255,255,255,0.06) inset;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    opacity:0;
    transform: translateY(16px);
    animation: panelIn .75s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes panelIn{ to{opacity:1; transform:translateY(0);} }

  /* ---------- decorative light sweep (crossing rays, drawn once) ---------- */
  .rays{
    position:absolute; inset:0; width:100%; height:230px;
    pointer-events:none;
    opacity:.55;
  }
  .rays path{
    fill:none;
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-dasharray: 420;
    stroke-dashoffset: 420;
    animation: draw 1.6s .3s cubic-bezier(.16,.8,.2,1) forwards;
  }
  .rays .r2{ animation-delay:.42s; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .sidebar::after{
    content:"";
    position:absolute;
    left:50%; bottom:-170px;
    width:540px; height:360px;
    transform:translateX(-50%);
    background: radial-gradient(closest-side, rgba(79,150,232,0.08), transparent 70%);
    pointer-events:none;
  }

  /* ---------- brand header ---------- */
  .brand{
    position:relative;
    padding:32px 24px 22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    border-bottom:1px solid var(--accent-line);
    z-index:1;
  }
  .crest{
    position:relative;
    width:58px; height:58px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background: linear-gradient(160deg, rgba(79,150,232,0.20), rgba(79,150,232,0.04));
    border:1px solid rgba(90,160,240,0.4);
    margin-bottom:14px;
    opacity:0; transform:scale(.7);
    animation: crestIn .6s .2s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .crest::after{
    content:"";
    position:absolute;
    inset:-9px;
    border-radius:50%;
    border:1px solid rgba(90,160,240,0.3);
    animation: breathe 4.5s ease-in-out infinite;
  }
  .crest::before{
    content:"";
    position:absolute;
    inset:-16px;
    border-radius:50%;
    border:1px solid rgba(90,160,240,0.14);
    animation: breathe 4.5s .6s ease-in-out infinite;
  }
  @keyframes crestIn{ to{opacity:1; transform:scale(1);} }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:.55; }
    50%{ transform:scale(1.16); opacity:0; }
  }
  .crest svg{ width:27px; height:27px; }

  .brand-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:27px;
    letter-spacing:0.045em;
    color:var(--accent-soft);
    line-height:1;
    opacity:0; transform:translateY(6px);
    animation: fadeUp .55s .34s ease forwards;
  }
  .brand-sub{
    margin-top:7px;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.18em;
    color:var(--text-faint);
    opacity:0; transform:translateY(6px);
    animation: fadeUp .55s .42s ease forwards;
  }
  .brand-org{
    margin-top:11px;
    font-size:12px;
    line-height:1.5;
    color:var(--text-muted);
    max-width:226px;
    opacity:0; transform:translateY(6px);
    animation: fadeUp .55s .5s ease forwards;
  }
  @keyframes fadeUp{ to{opacity:1; transform:translateY(0);} }

  /* ---------- nav structure ---------- */
  .nav-scroll{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    padding:20px 16px 10px;
    position:relative;
  }
  .nav-scroll::-webkit-scrollbar{ width:5px; }
  .nav-scroll::-webkit-scrollbar-thumb{ background:rgba(90,160,240,0.28); border-radius:3px; }

  .rail{
    position:absolute;
    left:27px; top:22px; bottom:14px;
    width:1px;
    background: linear-gradient(180deg, rgba(90,160,240,0.35), rgba(90,160,240,0.05) 85%);
  }

  .nav-group{
    position:relative;
    margin-bottom:14px;
    opacity:0; transform:translateX(-10px);
    animation: itemIn .5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .nav-group:nth-of-type(1){ animation-delay:.42s; }
  .nav-group:nth-of-type(2){ animation-delay:.48s; }
  .nav-group:nth-of-type(3){ animation-delay:.54s; }
  .nav-group:nth-of-type(4){ animation-delay:.6s; }
  @keyframes itemIn{ to{opacity:1; transform:translateX(0);} }

  .group-head{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px 6px 8px 0;
    font-family:inherit;
  }
  .group-dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(90,160,240,0.7);
    flex-shrink:0;
    margin-left:24px;
  }
  .group-label{
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.13em;
    color:var(--text-faint);
    flex:1;
    text-align:left;
  }
  .chevron{
    width:13px; height:13px;
    color:var(--text-faint);
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
    flex-shrink:0;
    margin-right:2px;
  }
  .chevron svg{ width:100%; height:100%; }
  .nav-group.collapsed .chevron{ transform:rotate(-90deg); }

  .group-body{
    display:grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows .38s cubic-bezier(.2,.8,.2,1);
  }
  .nav-group.collapsed .group-body{ grid-template-rows: 0fr; }
  .group-body-inner{ overflow:hidden; }

  .nav-list{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:2px;
    position:relative;
    padding-left:20px;
    margin-left:4px;
  }

  .pill{
    position:absolute;
    left:0; right:0;
    top:0; height:0;
    border-radius:11px;
    background: linear-gradient(90deg, var(--active-bg), rgba(79,150,232,0.02));
    opacity:0;
    transition: top .32s cubic-bezier(.2,.85,.25,1), height .32s cubic-bezier(.2,.85,.25,1), opacity .25s ease;
    pointer-events:none;
    z-index:0;
  }
  .nav-group.collapsed .pill{ opacity:0; }
  .pill::before{
    content:"";
    position:absolute;
    left:0; top:50%;
    transform:translateY(-50%);
    width:3px; height:60%;
    border-radius:0 3px 3px 0;
    background: linear-gradient(180deg, var(--accent-soft), var(--accent));
    box-shadow: 0 0 10px rgba(90,160,240,0.6);
  }

  .nav-link{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:11px;
    padding:9.5px 12px;
    border-radius:11px;
    color:var(--text-muted);
    text-decoration:none;
    font-size:13.3px;
    font-weight:500;
    cursor:pointer;
    transition: color .25s ease, background .25s ease;
    background:transparent;
    border:none;
    width:100%;
    text-align:left;
    font-family:inherit;
  }
  .nav-link .ic{
    width:26px; height:26px;
    flex-shrink:0;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    transition: background .25s ease, border-color .25s ease, transform .25s ease;
  }
  .nav-link .ic svg{ width:15px; height:15px; transition: stroke .25s ease; }

  .nav-link:hover{ color:var(--text-primary); }
  .nav-link:hover .ic{ transform:translateY(-1px); background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.1); }

  .nav-link.active{ color:var(--accent-soft); }
  .nav-link.active .ic{
    background: linear-gradient(160deg, rgba(90,160,240,0.28), rgba(90,160,240,0.06));
    border-color: rgba(90,160,240,0.45);
  }
  .nav-link.active .ic svg{ stroke:var(--accent-soft); }

  .badge{
    margin-left:auto;
    font-size:10px;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    background: rgba(90,160,240,0.16);
    color:var(--accent-soft);
    letter-spacing:.02em;
  }

  /* ---------- footer ---------- */
  .sidebar-footer{
    position:relative;
    z-index:1;
    padding:16px 16px 20px;
    border-top:1px solid var(--accent-line);
    display:flex;
    flex-direction:column;
    gap:2px;
    opacity:0; transform:translateY(8px);
    animation: fadeUp .55s .72s ease forwards;
  }

  .user-chip{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 11px;
    margin:2px 0 12px;
    border-radius:13px;
    background: var(--glass);
    border:1px solid var(--glass-border);
  }
  .avatar-ring{
    position:relative;
    width:36px; height:36px;
    border-radius:50%;
    padding:2px;
    background: conic-gradient(from 0deg, var(--accent-soft), var(--accent), rgba(90,160,240,0.15), var(--accent-soft));
    animation: spin 7s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .user-avatar{
    width:100%; height:100%;
    border-radius:50%;
    background: #0c1442;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:14px;
    color:var(--accent-soft);
  }
  .status-dot{
    position:absolute;
    bottom:-1px; right:-1px;
    width:10px; height:10px;
    border-radius:50%;
    background:#5fe89c;
    border:2px solid #0c1442;
  }
  .status-dot::after{
    content:"";
    position:absolute; inset:-3px;
    border-radius:50%;
    border:1px solid #5fe89c;
    animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform:scale(.6); opacity:.8; }
    100%{ transform:scale(1.8); opacity:0; }
  }
  .user-meta{ line-height:1.25; overflow:hidden; }
  .user-name{ font-size:12.5px; font-weight:600; color:var(--text-primary); white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
  .user-role{ font-size:10.5px; color:var(--text-faint); }

  .footer-link.logout{ color:#d98f7f; }
  .footer-link.logout .ic{ background:rgba(232,115,95,0.06); border-color:rgba(232,115,95,0.12); }
  .footer-link.logout:hover{ color:var(--danger); }
  .footer-link.logout:hover .ic{ background:rgba(232,115,95,0.12); border-color:rgba(232,115,95,0.25); }
  .footer-link.logout:hover .ic svg{ stroke:var(--danger); }

  .hint{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    font-family:'Inter',sans-serif; font-size:11.5px; color:#5a6390;
    letter-spacing:.02em;
  }
</style>
</head>

<script>
  function movePill(link){
    const list = link.closest('.nav-list');
    const pill = list.querySelector('.pill');
    if(!pill) return;
    pill.style.top = link.offsetTop + 'px';
    pill.style.height = link.offsetHeight + 'px';
    pill.style.opacity = '1';
  }

  document.querySelectorAll('.nav-link:not(.logout)').forEach(link=>{
    link.addEventListener('click', ()=>{
      document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
      document.querySelectorAll('.pill').forEach(p=>{ p.style.opacity='0'; });
      link.classList.add('active');
      if(link.closest('.nav-list')) movePill(link);
    });
  });

  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const group = btn.closest('.nav-group');
      group.classList.toggle('collapsed');
      const active = group.querySelector('.nav-link.active');
      if(active){
        setTimeout(()=>{ if(!group.classList.contains('collapsed')) movePill(active); }, 60);
      }
    });
  });

  window.addEventListener('load', ()=>{
    const active = document.querySelector('.nav-link.active');
    if(active) movePill(active);
  });
</script>
